name: Build ImmortalWrt firmware

on:
  workflow_dispatch:
    inputs:
      immortalwrt_ref:
        description: "ImmortalWrt git ref (branch, tag, or SHA; empty = IMMORTALWRT_REF or upstream default branch)"
        type: string
        required: false
        default: ""
      cache_epoch:
        description: "Cache namespace/epoch; change it to save refreshed ccache and dl snapshots"
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.immortalwrt_ref || vars.IMMORTALWRT_REF || 'default' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMMORTALWRT_REF: ${{ inputs.immortalwrt_ref || vars.IMMORTALWRT_REF || '' }}
  CACHE_EPOCH: ${{ inputs.cache_epoch || vars.CACHE_EPOCH || 'v1' }}
  CCACHE_MAX_SIZE: 4G

jobs:
  build:
    name: Build TR3000
    runs-on: ubuntu-latest
    outputs:
      firmware_artifact_id: ${{ steps.upload-firmware.outputs.artifact-id }}
      provenance_artifact_id: ${{ steps.upload-provenance.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Free disk space
        continue-on-error: true
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "false"
          remove-cached-tools: "false"
          remove-swapfile: "false"
          verbose: "false"

      - name: Checkout firmware builder repository
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1

      - name: Checkout ImmortalWrt source (default branch)
        if: ${{ env.IMMORTALWRT_REF == '' }}
        uses: actions/checkout@v6
        with:
          repository: immortalwrt/immortalwrt
          path: immortalwrt
          submodules: recursive
          fetch-depth: 1

      - name: Checkout ImmortalWrt source (requested ref)
        if: ${{ env.IMMORTALWRT_REF != '' }}
        uses: actions/checkout@v6
        with:
          repository: immortalwrt/immortalwrt
          path: immortalwrt
          ref: ${{ env.IMMORTALWRT_REF }}
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils gcc-multilib gettext flex gawk \
            bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar \
            g++-multilib git libgnutls28-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev lld llvm lrzsz genisoimage msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          # Ubuntu 26.04 defaults to uutils; select its supported GNU provider for the build.
          sudo apt-get install -y --allow-remove-essential coreutils-from-gnu coreutils-from-uutils-
          install --version
          install --version | grep -q GNU
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Prepare cache keys and directories
        id: cache-vars
        run: |
          mkdir -p immortalwrt/.ccache immortalwrt/dl
          python3 scripts/ci.py cache-keys >> "$GITHUB_OUTPUT"
          {
            echo "### Cache namespace"
            echo "ccache/dl caches are immutable once created."
            echo "Each run attempt restores an older matching snapshot and saves under a new key automatically."
            echo "Use \`cache_epoch\` or \`CACHE_EPOCH\` for a manual namespace change; fallback prefixes may still reuse older caches."
            echo "Current namespace: \`${CACHE_EPOCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore ccache
        continue-on-error: true
        uses: actions/cache/restore@v5.0.4
        with:
          path: immortalwrt/.ccache
          key: ${{ steps.cache-vars.outputs.ccache_key }}
          restore-keys: |
            ${{ steps.cache-vars.outputs.ccache_prefix }}
            ${{ steps.cache-vars.outputs.ccache_ref_prefix }}
            ${{ steps.cache-vars.outputs.ccache_target_prefix }}

      - name: Restore downloads
        continue-on-error: true
        uses: actions/cache/restore@v5.0.4
        with:
          path: immortalwrt/dl
          key: ${{ steps.cache-vars.outputs.dl_key }}
          restore-keys: |
            ${{ steps.cache-vars.outputs.dl_prefix }}
            ${{ steps.cache-vars.outputs.dl_ref_prefix }}
            ${{ steps.cache-vars.outputs.dl_target_prefix }}

      - name: Configure firmware
        id: configure
        run: |
          python3 scripts/configure.py immortalwrt --ccache

      - name: Build firmware
        id: compile
        run: |
          cd immortalwrt
          CCACHE_DIR="$(pwd)/.ccache"
          export CCACHE_DIR
          ccache -M "${CCACHE_MAX_SIZE}"
          jobs="$(nproc)"
          printf "%s thread compile\n" "${jobs}"
          make -j"${jobs}" || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "file_date=_$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Record build provenance
        id: provenance
        if: ${{ !cancelled() && steps.configure.outcome != 'skipped' }}
        env:
          CONFIGURATION_OUTCOME: ${{ steps.configure.outcome }}
          COMPILATION_OUTCOME: ${{ steps.compile.outcome }}
        run: python3 scripts/ci.py provenance immortalwrt provenance

      - name: Upload build provenance
        id: upload-provenance
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.0
        with:
          name: immortalwrt_build_provenance_tr3000_${{ github.run_id }}_${{ github.run_attempt }}
          path: provenance/*
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup build workspace
        if: ${{ !cancelled() && steps.compile.outputs.status == 'success' }}
        run: |
          echo "Disk usage before cleanup:"
          df -h
          rm -rf immortalwrt/tmp 2>/dev/null || true
          find immortalwrt -name "*.log" -size +100M -delete 2>/dev/null || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Ccache stats
        if: ${{ !cancelled() }}
        run: CCACHE_DIR=immortalwrt/.ccache ccache -s || true

      - name: Save ccache
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v5.0.4
        with:
          path: immortalwrt/.ccache
          key: ${{ steps.cache-vars.outputs.ccache_key }}

      - name: Save downloads
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v5.0.4
        with:
          path: immortalwrt/dl
          key: ${{ steps.cache-vars.outputs.dl_key }}

      - name: Collect firmware files
        run: python3 scripts/ci.py collect immortalwrt/bin/targets/mediatek/filogic firmware

      - name: Upload firmware files
        id: upload-firmware
        uses: actions/upload-artifact@v7.0.0
        with:
          name: immortalwrt_firmware_tr3000${{ steps.compile.outputs.file_date }}
          path: firmware/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Release firmware
    if: ${{ always() && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout firmware builder repository
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.firmware_artifact_id }}
          path: release/firmware

      - name: Download build provenance
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.provenance_artifact_id }}
          path: release/provenance

      - name: Organize TR3000 release files
        run: python3 scripts/ci.py collect release/firmware release/tr3000

      - name: Validate release provenance
        run: python3 scripts/ci.py verify-provenance release/provenance

      - name: Generate release tag
        id: tag
        run: |
          version_prefixed="immortalwrt-${IMMORTALWRT_REF:-default}"
          version_safe="${version_prefixed//[^A-Za-z0-9._-]/_}"
          date_tag="$(date +"%Y%m%d-%H%M")"
          echo "release_tag=${version_safe}-build${GITHUB_RUN_NUMBER}-${date_tag}" >> "$GITHUB_OUTPUT"

      - name: Summarize artifacts
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          info = json.loads(Path('release/provenance/build-info.json').read_text())
          source_label = os.environ.get('IMMORTALWRT_REF') or 'default branch'
          Path('release.md').write_text(
              f'ImmortalWrt {source_label} firmware for\n- Cudy TR3000 (Filogic)\n\n'
              f"Builder commit: `{info['builder_commit']}`\n\n"
              f"ImmortalWrt commit: `{info['immortalwrt_commit']}`\n\n"
              'Exact feed revisions, seed, generated configuration and any source patch '
              'are attached as provenance files.\n'
          )
          PY
          cat release.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: release.md
          fail_on_unmatched_files: true
          files: |
            release/tr3000/*
            release/provenance/*
